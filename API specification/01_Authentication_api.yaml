openapi: 3.0.0
info:
  title: CAB System - Phân hệ 1: Xác thực & Người dùng (Authentication)
  version: 1.0.0
  description: |
    Tài liệu đặc tả API cho Phân hệ Xác thực & Quản lý người dùng.
    - Phục vụ Yêu cầu chức năng: FR-AUTH-01 đến FR-AUTH-06
    - Tiêu chí chấp nhận: AC-AUTH-01, AC-AUTH-02
    - Tác giả: Võ Tất Thiện (22652711)
servers:
  - url: http://localhost:3000/api/v1
    description: Development Server (v1)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Xác thực, đăng ký, đăng nhập và quản lý phiên làm việc
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản Khách hàng
      description: Tạo tài khoản khách hàng mới. Yêu cầu email và số điện thoại duy nhất.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phone
                - password
              properties:
                fullName:
                  type: string
                  example: Nguyễn Văn A
                email:
                  type: string
                  format: email
                  example: customer@example.com
                phone:
                  type: string
                  example: "0912345678"
                password:
                  type: string
                  format: password
                  example: Password123
      responses:
        "201":
          description: Đăng ký thành công
        "400":
          description: Dữ liệu không hợp lệ
        "409":
          description: Email hoặc số điện thoại đã tồn tại
        "500":
          description: Lỗi máy chủ nội bộ

  /auth/register/driver:
    post:
      summary: Đăng ký tài khoản Đối tác Tài xế
      description: Tạo tài khoản tài xế kèm thông tin GPLX và phương tiện xe ban đầu.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phone
                - password
                - licenseNumber
                - licenseClass
                - plateNumber
                - vehicleType
              properties:
                fullName:
                  type: string
                  example: Trần Văn Tài
                email:
                  type: string
                  format: email
                  example: driver@example.com
                phone:
                  type: string
                  example: "0987654321"
                password:
                  type: string
                  example: Driver123
                licenseNumber:
                  type: string
                  example: "123456789012"
                licenseClass:
                  type: string
                  enum: [B1, B2, C, D]
                  example: B2
                plateNumber:
                  type: string
                  example: 51G-888.88
                vehicleType:
                  type: string
                  enum: [sedan, suv, van]
                  example: sedan
                brand:
                  type: string
                  example: Toyota
                model:
                  type: string
                  example: Vios
                color:
                  type: string
                  example: Trắng
      responses:
        "201":
          description: Đăng ký hồ sơ tài xế thành công, chờ duyệt
        "409":
          description: Thông tin GPLX, biển số xe hoặc tài khoản bị trùng lặp

  /auth/login:
    post:
      summary: Đăng nhập hệ thống
      description: Xác thực người dùng bằng email và mật khẩu, cấp Access Token và Refresh Token.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: customer@example.com
                password:
                  type: string
                  example: Password123
      responses:
        "200":
          description: Đăng nhập thành công, trả về cặp Token và thông tin cơ bản
        "401":
          description: Sai email hoặc mật khẩu
        "403":
          description: Tài khoản đã bị khóa
        "429":
          description: Thử sai quá 5 lần, bị khóa tạm 15 phút

  /auth/profile:
    get:
      summary: Lấy thông tin cá nhân
      description: Trả về thông tin hồ sơ của người dùng đang đăng nhập.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lấy thông tin thành công
        "401":
          description: Chưa xác thực (Token không hợp lệ)
    put:
      summary: Cập nhật hồ sơ cá nhân
      description: Cập nhật họ tên, số điện thoại của người dùng.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  example: Nguyễn Văn A (Cập nhật)
                phone:
                  type: string
                  example: "0912345679"
      responses:
        "200":
          description: Cập nhật thành công

  /auth/change-password:
    put:
      summary: Đổi mật khẩu
      description: Người dùng đổi mật khẩu khi biết mật khẩu hiện tại.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  example: Password123
                newPassword:
                  type: string
                  example: NewPassword456
      responses:
        "200":
          description: Đổi mật khẩu thành công
        "400":
          description: Mật khẩu hiện tại không đúng

  /auth/logout:
    post:
      summary: Đăng xuất hệ thống
      description: Thu hồi phiên đăng nhập và xóa Refresh Token.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đăng xuất thành công

  /auth/refresh-token:
    post:
      summary: Cấp mới Access Token
      description: Sử dụng Refresh Token hợp lệ để lấy Access Token mới (15 phút).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Cấp token mới thành công
        "401":
          description: Refresh Token không hợp lệ hoặc đã hết hạn

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cabsystem_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: cabsystem2026
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express
    container_name: cabsystem_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: cabsystem2026
      ME_CONFIG_MONGODB_URL: mongodb://root:cabsystem2026@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo_data:
